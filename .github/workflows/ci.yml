name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: contents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d contents"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Test (unit + integration)
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/contents?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/15
        run: go test -race -tags=integration -coverprofile=coverage.out ./...
