<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content Search</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Content Search</h1>
      <span class="muted">JSON ve XML provider'lardan birleştirilmiş içerikler</span>
    </div>
    <div class="sync">
      <span id="sync-status" class="muted">Senkronizasyon durumu yükleniyor…</span>
      <button id="sync-btn" type="button" class="secondary">Şimdi senkronize et</button>
    </div>
  </header>

  <main>
    <form id="filters" class="filters" autocomplete="off">
      <label class="grow">
        <span>Anahtar kelime</span>
        <input id="q" name="q" type="search" placeholder="örn. go, docker, kubernetes">
      </label>
      <label>
        <span>İçerik türü</span>
        <select id="type" name="type">
          <option value="">Tümü</option>
          <option value="video">Video</option>
          <option value="text">Metin</option>
        </select>
      </label>
      <label>
        <span>Sıralama</span>
        <select id="sort" name="sort">
          <option value="">Otomatik</option>
          <option value="popularity">Popülerlik</option>
          <option value="relevance">Alakalılık</option>
        </select>
      </label>
      <label>
        <span>Sayfa boyutu</span>
        <select id="per_page" name="per_page">
          <option>5</option>
          <option selected>10</option>
          <option>20</option>
          <option>50</option>
        </select>
      </label>
    </form>

    <p id="sort-hint" class="hint" hidden>
      Alakalılık sıralaması bir anahtar kelimeye göre hesaplanır. Kelime girilmediği için sonuçlar popülerliğe göre sıralandı.
    </p>

    <div id="error" class="error" hidden></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Başlık</th>
            <th>Tür</th>
            <th class="num">Skor</th>
            <th class="num" id="relevance-col" hidden>Alakalılık</th>
            <th class="hide-sm">Provider</th>
            <th class="hide-sm">Yayın tarihi</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <nav class="pager">
      <button id="prev" type="button" class="secondary">← Önceki</button>
      <span id="page-info" class="muted"></span>
      <button id="next" type="button" class="secondary">Sonraki →</button>
    </nav>
  </main>

  <dialog id="detail">
    <form method="dialog">
      <h2 id="detail-title"></h2>
      <dl id="detail-body"></dl>
      <button class="secondary">Kapat</button>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
