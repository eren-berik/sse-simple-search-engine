openapi: 3.0.3
info:
  title: Content Search API
  version: 1.0.0
  description: |
    Aggregates content from multiple providers (JSON and XML), scores it with a common formula
    and serves keyword search with filtering, sorting and pagination.

    **Scoring:** `final = base * type_coefficient + recency + engagement`

    | | Video | Text |
    |---|---|---|
    | base | `views/1000 + likes/100` | `reading_time + reactions/50` |
    | type_coefficient | 1.5 | 1.0 |
    | engagement | `(likes/views) * 10` | `(reactions/reading_time) * 5` |

    recency: within 7 days +5, 30 days +3, 90 days +1, otherwise 0.
servers:
  - url: http://localhost:8080
tags:
  - name: contents
  - name: sync
  - name: health

paths:
  /api/v1/contents:
    get:
      tags: [contents]
      summary: Search contents
      description: |
        Keyword search over titles and tags (full-text plus substring match on the title).
        Without `sort`, results are ordered by relevance when `q` is set and by popularity otherwise.
        Relevance sorting without a keyword falls back to popularity.
        Responses are cached; the `X-Cache` header reports `HIT`, `MISS` or `BYPASS` (cache unavailable).
      parameters:
        - name: q
          in: query
          description: Keyword(s). Supports websearch syntax such as `"exact phrase"` and `-exclude`.
          schema: { type: string, maxLength: 200 }
          example: go
        - name: type
          in: query
          schema: { type: string, enum: [video, text] }
        - name: sort
          in: query
          schema: { type: string, enum: [popularity, relevance] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of contents
          headers:
            X-Cache:
              schema: { type: string, enum: [HIT, MISS, BYPASS] }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Content' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/contents/{id}:
    get:
      tags: [contents]
      summary: Get a content item with its score breakdown
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: The content item
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ContentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sync/runs:
    get:
      tags: [sync]
      summary: Latest sync run per provider
      responses:
        '200':
          description: Latest runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SyncRun' }

  /api/v1/admin/sync:
    post:
      tags: [sync]
      summary: Fetch all providers now
      description: Providers are also synced automatically on startup and every `SYNC_INTERVAL`.
      security:
        - apiKey: []
      responses:
        '200':
          description: Sync report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SyncReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Admin endpoints disabled (no ADMIN_API_KEY configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A sync is already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        '200': { description: Process is up }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      description: Fails when the database is unreachable. A cache outage reports `degraded` but stays ready.
      responses:
        '200': { description: Ready (ok or degraded) }
        '503': { description: Database unavailable }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Metrics:
      type: object
      description: Video items carry views/likes/duration_sec; text items carry reading_time/reactions/comments. Zero values are omitted.
      properties:
        views: { type: integer }
        likes: { type: integer }
        duration_sec: { type: integer }
        reading_time: { type: integer, description: minutes }
        reactions: { type: integer }
        comments: { type: integer }

    Content:
      type: object
      required: [id, provider, external_id, title, type, score, metrics, tags, published_at]
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string, example: provider1 }
        external_id: { type: string, example: v1 }
        title: { type: string, example: Go Programming Tutorial }
        type: { type: string, enum: [video, text] }
        score: { type: number, example: 41.3 }
        relevance:
          type: number
          description: Present only when sorted by relevance.
        metrics: { $ref: '#/components/schemas/Metrics' }
        tags:
          type: array
          items: { type: string }
        published_at: { type: string, format: date-time }

    ContentDetail:
      allOf:
        - $ref: '#/components/schemas/Content'
        - type: object
          properties:
            score_breakdown: { $ref: '#/components/schemas/ScoreBreakdown' }

    ScoreBreakdown:
      type: object
      description: Computed at request time; may differ slightly from the stored score until the next sync refreshes recency.
      properties:
        base: { type: number, example: 27 }
        type_coefficient: { type: number, example: 1.5 }
        recency: { type: number, example: 0 }
        engagement: { type: number, example: 0.8 }
        final: { type: number, example: 41.3 }

    ListMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
        sort: { type: string, enum: [popularity, relevance] }

    SyncRun:
      type: object
      properties:
        provider: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        status: { type: string, enum: [success, failed] }
        fetched: { type: integer }
        upserted: { type: integer }
        error: { type: string }

    SyncReport:
      type: object
      properties:
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        rescored: { type: integer, description: Items not returned by providers whose scores were refreshed }
        runs:
          type: array
          items: { $ref: '#/components/schemas/SyncRun' }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: invalid_input }
            message: { type: string }

  responses:
    BadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
