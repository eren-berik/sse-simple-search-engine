# Scrapes each service's metrics listener (METRICS_ADDR, :9100). The listeners are only
# reachable on the compose network; the services' public port never serves /metrics.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: sse-gateway
    static_configs:
      - targets: ["sse-gateway:9100"]
  - job_name: iam-service
    static_configs:
      - targets: ["iam-service:9100"]
  - job_name: sse-service
    static_configs:
      - targets: ["sse-service:9100"]
