openapi: 3.0.3
info:
  title: Content Search API
  version: 2.0.0
  description: |
    Public API exposed by **sse-gateway**. The gateway forwards each call to the service that owns it:

    | Path | Service |
    |---|---|
    | `/api/v1/auth/*` | iam-service (users, tokens) |
    | `/api/v1/contents`, `/api/v1/providers`, `/api/v1/sync` | sse-service (search, providers, sync) |

    **Authentication:** register or log in to get an `access_token` (JWT, RS256, 15 min) and a
    `refresh_token` (opaque, rotated on every use). Send the access token as `Authorization: Bearer <token>`.
    When it expires, exchange the refresh token at `/api/v1/auth/refresh`. Reusing an already rotated
    refresh token revokes the whole session.

    **Roles:** `viewer` can search, filter and read providers and sync runs; `admin` can additionally
    create and update providers and trigger syncs.

    **Scoring:** `final = base * type_coefficient + recency + engagement`

    | | Video | Text |
    |---|---|---|
    | base | `views/1000 + likes/100` | `reading_time + reactions/50` |
    | type_coefficient | 1.5 | 1.0 |
    | engagement | `(likes/views) * 10` | `(reactions/reading_time) * 5` |

    recency: within 7 days +5, 30 days +3, 90 days +1, otherwise 0.

    **Edge checks:** the gateway verifies the access token and the role before forwarding, so a rejected
    request never reaches a service; sse-service verifies the token again.

    **Rate limits** (defaults; every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining` and
    `X-RateLimit-Reset` for the tightest limit that applied, a `429` also carries `Retry-After`):

    | Tier | Key | Limit | Applies to |
    |---|---|---|---|
    | ip | client IP | 300/min | every `/api` request, before authentication |
    | auth | client IP | 10/min | login, register, refresh |
    | user | token subject | 100/min | every authenticated request |
    | sync | token subject | 5/min | `POST /sync`, `POST /providers/{id}/sync` |

    **Resilience:** each backing service has its own circuit breaker. After repeated failures
    (connection errors, 502/503/504) its circuit opens and calls fail fast with
    `503 upstream_unavailable` and `Retry-After` until a trial request succeeds. `GET` requests are
    retried up to twice with exponential backoff and jitter after connection errors, 502 or 503;
    writes and timeouts are never retried.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
  - name: contents
  - name: providers
  - name: sync
  - name: health

security:
  - bearerAuth: []

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a user and start a session
      description: The role defaults to `viewer`. Any role can be chosen at registration (demo policy).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$', example: alice, description: Stored lowercase }
                password: { type: string, minLength: 8, maxLength: 72, example: s3cret-pass }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Registered; tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Username already taken (`username_taken`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: alice }
                password: { type: string, example: s3cret-pass }
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401':
          description: Invalid username or password (`invalid_credentials`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and get a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401':
          description: Unknown, expired, revoked or reused refresh token (`invalid_refresh_token`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the session of a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Logged out (idempotent) }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/contents:
    get:
      tags: [contents]
      summary: Search contents
      description: |
        Keyword search over titles and tags (full-text plus substring match on the title).
        Without `sort`, results are ordered by relevance when `q` is set and by popularity otherwise;
        relevance without a keyword falls back to popularity (`meta.sort` reports the order used).
        Responses are cached; `X-Cache` reports `HIT`, `MISS` or `BYPASS`.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, example: go, description: 'Supports websearch syntax such as "exact phrase" and -exclude.' }
        - { name: type, in: query, schema: { type: string, enum: [video, text] } }
        - { name: provider, in: query, schema: { type: string }, description: Provider name }
        - { name: tag, in: query, schema: { type: string, maxLength: 50 }, example: devops, description: 'Only contents carrying this tag (case-insensitive)' }
        - { name: published_from, in: query, schema: { type: string, format: date }, example: '2024-03-01', description: 'Published on or after this day (YYYY-MM-DD, UTC)' }
        - { name: published_to, in: query, schema: { type: string, format: date }, example: '2024-03-31', description: 'Published on or before this day (YYYY-MM-DD, UTC, inclusive)' }
        - { name: sort, in: query, schema: { type: string, enum: [popularity, relevance], default: popularity }, description: 'relevance needs a keyword (q); without one, results are sorted by popularity' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: A page of contents
          headers:
            X-Cache:
              schema: { type: string, enum: [HIT, MISS, BYPASS] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Content' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/contents/{id}:
    get:
      tags: [contents]
      summary: Get a content item with its score breakdown
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, example: programming, description: 'A search keyword; adds relevance_breakdown, explaining how the item matched that search' }
      responses:
        '200':
          description: The content item
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ContentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/providers:
    get:
      tags: [providers]
      summary: List providers
      responses:
        '200':
          description: All configured providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Provider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [providers]
      summary: Add a provider (admin)
      description: |
        The provider's payload must follow the schema of a supported format (`json` like provider1, `xml` like provider2).
        When `format` is omitted or `auto`, the URL is fetched and the format whose adapter reads at least one
        valid item from it is used; if none does, the request fails with `400 invalid_input`.
        Its content is fetched on the next sync, or immediately with `POST /api/v1/providers/{id}/sync`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,49}$', example: my-feed }
                url: { type: string, format: uri, example: 'https://example.com/feed.json' }
                format: { $ref: '#/components/schemas/ProviderFormatInput' }
                enabled: { type: boolean, default: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Name already used (`conflict`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/providers/{id}:
    patch:
      tags: [providers]
      summary: Update a provider (admin)
      description: |
        Only the given fields change. Renaming moves the provider's contents and sync history to the new name.
        When `url` changes and `format` is omitted (or `auto`), the format is detected again from the new URL.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,49}$' }
                url: { type: string, format: uri }
                format: { $ref: '#/components/schemas/ProviderFormatInput' }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Name already used (`conflict`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [providers]
      summary: Delete a provider and its contents (admin)
      description: Permanently removes the provider, every content item ingested from it and its sync history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/providers/{id}/sync:
    post:
      tags: [sync]
      summary: Sync one provider now (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/SyncReport' }
        '400':
          description: Provider is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SyncInProgress' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/sync:
    post:
      tags: [sync]
      summary: Sync every enabled provider now (admin)
      description: Providers are also synced automatically on startup and every `SYNC_INTERVAL`.
      responses:
        '200': { $ref: '#/components/responses/SyncReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SyncInProgress' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/sync/runs:
    get:
      tags: [sync]
      summary: Latest sync run per provider
      responses:
        '200':
          description: Latest runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SyncRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /healthz:
    get:
      tags: [health]
      summary: Gateway liveness
      security: []
      responses:
        '200': { description: Process is up }

  /readyz:
    get:
      tags: [health]
      summary: Gateway readiness
      description: |
        Fails when iam-service or sse-service is unreachable. A Redis or JWKS outage and open circuits
        (`circuit:<service>`) only report `degraded`.
      security: []
      responses:
        '200': { description: Ready (ok or degraded) }
        '503': { description: A backing service is unavailable }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [viewer, admin]
      default: viewer

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }

    SessionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            token_type: { type: string, example: Bearer }
            access_token: { type: string, description: 'JWT (RS256). Claims: sub, username, role, iss, aud, exp' }
            expires_in: { type: integer, example: 900, description: Seconds }
            refresh_token: { type: string }
            refresh_expires_in: { type: integer, example: 604800, description: Seconds }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    ProviderFormat:
      type: string
      enum: [json, xml]

    ProviderFormatInput:
      type: string
      enum: [auto, json, xml]
      default: auto
      description: '`auto` (or omitted) detects the format from the provider URL'

    Provider:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: provider1 }
        url: { type: string, format: uri }
        format: { $ref: '#/components/schemas/ProviderFormat' }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Metrics:
      type: object
      description: Video items carry views/likes/duration_sec; text items carry reading_time/reactions/comments. Zero values are omitted.
      properties:
        views: { type: integer }
        likes: { type: integer }
        duration_sec: { type: integer }
        reading_time: { type: integer, description: minutes }
        reactions: { type: integer }
        comments: { type: integer }

    Content:
      type: object
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string, example: provider1 }
        external_id: { type: string, example: v1 }
        title: { type: string, example: Go Programming Tutorial }
        type: { type: string, enum: [video, text] }
        score: { type: number, example: 41.3 }
        relevance: { type: number, description: 'Raw relevance: weighted ts_rank for whole-word matches (title 1.0, tags 0.8), scaled word similarity for partial ones; present only when sorted by relevance' }
        match: { type: integer, minimum: 0, maximum: 100, example: 97, description: 'Relevance as a percentage of the best match of the whole search (the best is 100, on every page); present only when sorted by relevance' }
        metrics: { $ref: '#/components/schemas/Metrics' }
        tags:
          type: array
          items: { type: string }
        published_at: { type: string, format: date-time }

    ContentDetail:
      allOf:
        - $ref: '#/components/schemas/Content'
        - type: object
          properties:
            relevance_breakdown:
              type: object
              description: |
                Present when requested with ?q=. How the item matched the search, from the same SQL that ranks results:
                where each word is found, and for a whole-word match the ts_rank steps (weight / position², summed and
                divided by π²/6; only for single-word searches, since several words also weigh their proximity), or for
                a partial match word_similarity × partial_factor.
              properties:
                query: { type: string }
                matches: { type: boolean }
                kind: { type: string, enum: [full_text, partial, none] }
                terms:
                  type: array
                  items:
                    type: object
                    properties:
                      term: { type: string }
                      in_title: { type: integer }
                      in_tags: { type: integer }
                title_weight: { type: number, example: 1 }
                tag_weight: { type: number, example: 0.8 }
                rank: { type: number, example: 0.4863 }
                rank_steps:
                  type: array
                  items:
                    type: object
                    properties:
                      field: { type: string, enum: [title, tags] }
                      weight: { type: number }
                      position: { type: integer }
                      value: { type: number }
                rank_normalizer: { type: number, example: 1.6449 }
                word_similarity: { type: number }
                partial_factor: { type: number, example: 0.4 }
                relevance: { type: number }
            score_breakdown:
              type: object
              properties:
                base: { type: number }
                type_coefficient: { type: number }
                recency: { type: number }
                engagement: { type: number }
                final: { type: number }
                explanation:
                  type: object
                  description: |
                    How each component was derived, produced by the same code that computes the score.
                    `base` is the sum of `base_terms[].result`; `final = base * type_coefficient + recency + engagement`.
                  properties:
                    base_terms:
                      type: array
                      items:
                        type: object
                        description: '`value / divisor = result` for one metric'
                        properties:
                          metric: { type: string, example: views }
                          value: { type: number, example: 15000 }
                          divisor: { type: number, example: 1000 }
                          result: { type: number, example: 15 }
                    engagement:
                      type: object
                      description: '`(numerator_value / denominator_value) * multiplier = result`; 0 when the denominator is 0'
                      properties:
                        numerator: { type: string, example: likes }
                        numerator_value: { type: number, example: 1200 }
                        denominator: { type: string, example: views }
                        denominator_value: { type: number, example: 15000 }
                        multiplier: { type: number, example: 10 }
                        result: { type: number, example: 0.8 }
                    recency:
                      type: object
                      properties:
                        age_days: { type: number, example: 971 }
                        tiers:
                          type: array
                          items:
                            type: object
                            properties:
                              max_age_days: { type: number, example: 7 }
                              points: { type: number, example: 5 }
                        matched_tier: { type: integer, description: 'Index into tiers; -1 when older than every tier', example: -1 }
                        points: { type: number, example: 0 }

    ListMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
        sort: { type: string, enum: [popularity, relevance] }
        best_relevance: { type: number, description: 'Relevance of the best match of the whole search, the reference (100) of every match; only when sorted by relevance' }

    SyncRun:
      type: object
      properties:
        provider: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        status: { type: string, enum: [success, failed] }
        fetched: { type: integer }
        upserted: { type: integer }
        removed: { type: integer, description: 'Stored items hidden because the provider no longer returns them; only counted after a complete feed' }
        error: { type: string }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: invalid_input }
            message: { type: string }

  responses:
    BadRequest:
      description: Invalid parameters (`invalid_input`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired access token (`unauthorized`, `invalid_token`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The user's role does not allow this action (`forbidden`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests (`rate_limited`)
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the window resets }
        X-RateLimit-Limit: { schema: { type: integer } }
        X-RateLimit-Remaining: { schema: { type: integer } }
        X-RateLimit-Reset: { schema: { type: integer }, description: Seconds until the window resets }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: |
        A backing service is unavailable: its circuit is open (`upstream_unavailable`, with `Retry-After`)
        or the signing keys cannot be loaded (`auth_unavailable`).
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the circuit allows a trial request }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SyncInProgress:
      description: Another sync is running (`sync_in_progress`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SyncReport:
      description: Sync report
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  started_at: { type: string, format: date-time }
                  finished_at: { type: string, format: date-time }
                  rescored: { type: integer }
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/SyncRun' }
